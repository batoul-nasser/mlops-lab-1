name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t food11-api:ci .
      - run: docker run -d --name api -p 8000:8000 -e SKIP_MODEL=1 food11-api:ci
      - name: Check API health
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f api || true

  push:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/batoul-nasser/mlops-lab-1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
